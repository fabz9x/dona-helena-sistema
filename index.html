<body>
<div class="shell">
<aside class="side"><div class="brand"><span class="logo" id="logo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Dona Helena<small>Controle de medicamentos</small></span></div><span class="pill" id="src">Conectando</span><nav id="nav" aria-label="Seções"></nav><div class="me" id="me"></div></aside>
<main id="app"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id),GS='\x1d',DAY=864e5;
const h=(t,a,...c)=>{const e=document.createElement(t);for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k.slice(0,2)==='on')e[k]=v;else e.setAttribute(k,v===true?'':v)}for(const x of c.flat(9))if(x!=null&&x!==false)e.append(x);return e};
const p2=n=>String(n).padStart(2,'0');
const iso=d=>d?d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()):'';
const fromIso=s=>s?new Date(s+'T00:00:00'):null;
const dbr=s=>{const d=fromIso(s);return d?p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear():'—'};
const today=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const daysLeft=s=>{const d=fromIso(s);return d?Math.round((d-today())/DAY):null};
const nf=n=>Number(n).toLocaleString('pt-BR');
const SETORES=['Farmácia central','UTI','Pronto-socorro','Centro cirúrgico','Enfermaria','Ambulatório'];
const CATS=['Analgésico','Antiespasmódico','Antiemético','Antibiótico','Cardiovascular','Controlado','Emergência','Gastro','Hormônio','Soluções','Outros'];
function sev(d){if(d==null)return['sem','Sem validade'];if(d<0)return['bad','Vencido há '+(-d)+' d'];if(d===0)return['bad','Vence hoje'];if(d<=7)return['crit','Vence em '+d+' d'];if(d<=30)return['warn','Vence em '+d+' d'];return['ok',d+' dias']}
const tag=d=>{const[k,l]=sev(d);return h('span',{class:'tag '+k},l)};

/* ---------- GS1 ---------- */
const AI={'00':[18,0],'01':[14,0],'02':[14,0],'10':[0,20],'11':[6,0],'13':[6,0],'15':[6,0],'17':[6,0],'21':[0,20],'30':[0,8],'37':[0,8],'240':[0,30],'400':[0,30]};
function parseGS1(raw){
  let s=String(raw).trim().replace(/^\][A-Za-z]\d/,'').replace(/<GS>|\{GS\}|\u241D/g,GS);const out={};
  if(/\(\d{2,4}\)/.test(s)){for(const m of s.matchAll(/\((\d{2,4})\)([^(]*)/g))out[m[1]]=m[2].replace(/\x1d/g,'').trim();return out}
  let i=0;
  while(i<s.length){
    if(s[i]===GS){i++;continue}
    let ai=null;for(const n of[2,3,4]){const k=s.substr(i,n);if(AI[k]){ai=k;break}}
    if(!ai)throw new Error('Código GS1 não reconhecido perto da posição '+(i+1)+'.');
    i+=ai.length;const[fx,mx]=AI[ai];let v;
    if(fx){v=s.substr(i,fx);if(v.length<fx)throw new Error('O campo '+ai+' está incompleto.');i+=fx}
    else{const j=s.indexOf(GS,i),end=j<0?s.length:j;v=s.substring(i,Math.min(end,i+mx));i+=v.length}
    out[ai]=v;
  }
  return out;
}
const norm=g=>{const c=String(g||'').replace(/\D/g,'');return c?c.padStart(14,'0'):''};
const ck=b=>{let s=0;b.split('').reverse().forEach((x,i)=>s+=x*(i%2?1:3));return(10-s%10)%10};
const gtinOk=g=>{if(!/^\d{8,14}$/.test(g))return false;return ck(g.slice(0,-1))===+g.slice(-1)};
function pd(s){if(!/^\d{6}$/.test(s||''))return null;const y=2000+ +s.slice(0,2),m=+s.slice(2,4);let d=+s.slice(4);if(m<1||m>12)return null;const last=new Date(y,m,0).getDate();if(d===0)d=last;if(d>last)return null;return new Date(y,m-1,d)}

const SAMPLE_M=[['Dorflex','Dipirona 300 mg + orfenadrina 35 mg + cafeína 50 mg, comprimido','Analgésico',0,0,200],['Neosaldina','Dipirona 300 mg + isometepteno 30 mg + cafeína 30 mg, drágea','Analgésico',0,0,120],['Novalgina','Dipirona sódica 500 mg, comprimido','Analgésico',0,0,150],['Tylenol 750 mg','Paracetamol 750 mg, comprimido','Analgésico',0,0,150],['Buscopan Composto','Butilbrometo de escopolamina 10 mg + dipirona 250 mg, drágea','Antiespasmódico',0,0,100],['Dramin','Dimenidrinato 50 mg, comprimido','Antiemético',0,0,80],['Amoxicilina 500 mg','Cápsula','Antibiótico',0,0,120],['Ceftriaxona 1 g','Pó para solução injetável, frasco-ampola','Antibiótico',0,0,80],['Soro fisiológico 0,9%','Solução injetável, bolsa 500 mL','Soluções',0,0,400],['Insulina NPH','Suspensão injetável 100 UI/mL, frasco 10 mL','Hormônio',0,1,30],['Morfina 10 mg/mL','Solução injetável, ampola 1 mL','Controlado',1,0,40],['Diazepam 10 mg','Comprimido','Controlado',1,0,50],['Adrenalina 1 mg/mL','Solução injetável, ampola 1 mL','Emergência',0,0,60],['Omeprazol 40 mg','Pó para solução injetável, frasco-ampola','Gastro',0,0,60]];
const SG=SAMPLE_M.map((_,i)=>{const b='7890000000'+p2(i+1);return norm(b+ck(b))});
const sampleProd=g=>{const i=SG.indexOf(g);if(i<0)return null;const m=SAMPLE_M[i];return{nome:m[0],apres:m[1],cat:m[2],ctrl:!!m[3],frio:!!m[4],min:m[5]}};

/* ---------- estado e armazenamento ---------- */
const S={lotes:[],prod:{},cfg:{dias:[30,15,7,3,0]},ev:[],mode:'local',_w:true,me:{id:null},names:{},users:[],usersLoaded:false};
let SESSION=null;
const ROLE_LABEL={admin:'Administrador',operador:'Operador',consulta:'Somente consulta'};
function role(){return SESSION?SESSION.papel:'consulta'}
function isAdmin(){return role()==='admin'}
Object.defineProperty(S,'write',{get(){return this._w&&role()!=='consulta'},set(v){this._w=v}});
const SK='vc_sess';
function loadSess(){try{const v=sessionStorage.getItem(SK)||localStorage.getItem(SK);return v?JSON.parse(v):null}catch(e){return null}}
function saveSess(u,keep){const v=JSON.stringify({id:u.id,nome:u.nome,usuario:u.usuario||u.id,papel:u.papel,mc:!!u.mc});try{(keep?localStorage:sessionStorage).setItem(SK,v)}catch(e){}}
function clearSess(){try{sessionStorage.removeItem(SK);localStorage.removeItem(SK)}catch(e){}}
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
function newSalt(){const a=new Uint8Array(12);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(a);else for(let i=0;i<12;i++)a[i]=Math.floor(Math.random()*256);return b2h(a)}
async function hashPw(pw,salt){

  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false})}
  catch(e){const n=e&&e.name;say(n==='NotFoundError'?'Nenhuma câmera encontrada neste aparelho.':n==='NotReadableError'?'A câmera está em uso por outro aplicativo. Feche-o e tente de novo.':'Câmera sem autorização. Se a página está dentro de outro app, abra em uma nova aba e toque em Permitir. Se você já negou, toque no cadeado ao lado do endereço > Permissões > Câmera > Permitir.','bad');return}
  L_.v.srcObject=stream;await L_.v.play();L_.off.hidden=true;L_.fr.hidden=false;L_.bCam.hidden=true;L_.bStop.hidden=false;running=true;
  if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('data_matrix'))det=new BarcodeDetector({formats:['data_matrix','qr_code','code_128']})}catch(e){}}
  say(det||reader?'Câmera ativa. Aponte para o DataMatrix.':'A leitura por câmera não carregou. Use o leitor USB ou cole o texto.',det||reader?'':'bad');loop();
}
function stopCam(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(!L_)return;L_.v.srcObject=null;L_.off.hidden=false;L_.fr.hidden=true;L_.bCam.hidden=false;L_.bStop.hidden=true}

/* ---------- início ---------- */
async function boot(){
  S.cfg={...S.cfg,...LS.get('vc_cfg',{})};S.lotes=LS.get('vc_lotes',[]);S.prod=LS.get('vc_prod',{});S.ev=LS.get('vc_ev',[]);SESSION=loadSess();S.users=LS.get('vc_users',[]);S.usersLoaded=true;
  if(typeof claude!=='undefined'&&claude&&claude.use){
    try{db=await claude.use('db')}catch(e){db=null}
    try{userCap=await claude.use('user')}catch(e){userCap=null}
  }
  if(db){
    S.mode='db';S.lotes=[];S.prod={};S.ev=[];S.users=[];S.usersLoaded=false;
    if(userCap){try{S.me=await userCap.me()}catch(e){}try{if(await userCap.can('data.write')===false)S.write=false}catch(e){}}
    subscribe();
  }
  if(location.hash==='#demo'){location.hash='inicio';DEMO=!DEMO;LS.set('vc_demo',DEMO)}
  renderNav();route();setInterval(()=>{renderNav();notifyCheck()},60000);
}
(()=>{let n=0,t=0;$('logo').addEventListener('click',()=>{const k=Date.now();n=k-t<3000?n+1:1;t=k;if(n>=5){n=0;toggleDemo()}})})();
renderNav();app.append(h('p',{class:'empty'},'Carregando…'));
boot();
</script>
